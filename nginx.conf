server {
    listen 80;
    server_name kinetrova.ru www.kinetrova.ru;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://bot:8075/;
    }

    location /auth/ {
        proxy_pass http://bot:8075;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}